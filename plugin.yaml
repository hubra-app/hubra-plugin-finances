id: finances
name: Finances
version: "1.2.0"
hubra: ">=0.2.5,<1"
description: "The club's books: transactions, categories, the overview, recurring bookings, the monthly statement and the annual accounts. Invoices stay in Hubra."
author: Hubra
homepage: https://github.com/hubra-app/hubra-plugin-finances
license: AGPL-3.0-or-later
tags: [finance]
package: hubra_finances
modules: [finance.books, finance.budgets]
# Budgets was a plugin of its own; installing this version takes it over,
# with its budgets, module switch and permissions (Hubra docs/plugins.md).
replaces: [budgets]
requires: [finance]
uses: [routes, tables, events, jobs, contracts, frontend]
migrations: migrations
frontend: frontend/dist/plugin.js
